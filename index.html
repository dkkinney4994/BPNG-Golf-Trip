<script>
(function(){

  const app = document.getElementById('app');
  const rank1 = ["1st","2nd","3rd"];
  function ordinal(n){
    if(n%10===1 && n%100!==11) return n+"st";
    if(n%10===2 && n%100!==12) return n+"nd";
    if(n%10===3 && n%100!==13) return n+"rd";
    return n+"th";
  }

  let mode = "net";   // 'net' | 'gross'
  let view = "board"; // 'board' | 'history'
  let selectedHistoryYear = null; // null = not yet set; 'all' or a specific year string
  let historySubView = 'achievements'; // 'achievements' | 'scores'
  let rows = [];
  let historyRows = [];
  let historyError = null;
  let trophyRows = [];
  let trophyError = null;
  let highlightRows = [];
  let highlightError = null;
  let historyLoaded = false;
  let lastSync = null;
  let liveMode = false;

  function csvUrl(tab){
    return `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;
  }

  function renderShell(inner){
    const showModeToggle = liveMode && view === 'board';
    app.innerHTML = `
      <div class="masthead">
        <p class="eyebrow">${view==='board' ? 'Leaderboard' : 'Trip History'}</p>
        <h1 class="trip-title">${CONFIG.tripName}</h1>
        <p class="trip-sub">16 players &middot; 4 rounds &middot; stroke play, gross &amp; net</p>
        <div class="view-nav">
          <button id="nav-board" class="${view==='board'?'active':''}">This Trip</button>
          <span class="sep">/</span>
          <button id="nav-history" class="${view==='history'?'active':''}">History</button>
        </div>
        <div class="controls">
          ${showModeToggle ? `
          <div class="toggle">
            <button id="btn-net" class="${mode==='net'?'active':''}">Net</button>
            <button id="btn-gross" class="${mode==='gross'?'active':''}">Gross</button>
          </div>` : ``}
          <button class="refresh-btn" id="btn-refresh">Refresh now</button>
          <div class="sync-status">
            <span class="sync-dot ${liveMode?'live':''}"></span>
            <span id="sync-text">${syncLabel()}</span>
          </div>
        </div>
      </div>
      ${inner}
      <footer>
        <span>${view==='board' ? CONFIG.leaderboardTab : CONFIG.historyTab} tab &middot; auto-refresh every ${CONFIG.refreshSeconds}s</span>
        <span>Scores entered in the Google Sheet</span>
      </footer>
    `;
    document.getElementById('nav-board').onclick = () => { view='board'; renderBoard(); };
    document.getElementById('nav-history').onclick = () => { view='history'; goHistory(); };
    if(showModeToggle){
      document.getElementById('btn-net').onclick = () => { mode='net'; renderBoard(); };
      document.getElementById('btn-gross').onclick = () => { mode='gross'; renderBoard(); };
    }
    document.getElementById('btn-refresh').onclick = () => load(true);
  }

  function syncLabel(){
    if(!liveMode) return "not connected";
    if(!lastSync) return "syncing…";
    return "updated " + timeAgo(lastSync);
  }

  function timeAgo(d){
    const s = Math.round((Date.now()-d.getTime())/1000);
    if(s<10) return "just now";
    if(s<60) return s+"s ago";
    const m = Math.round(s/60);
    return m+"m ago";
  }

  /* ---------------- Setup state ---------------- */
  function renderSetup(){
    liveMode = false;
    renderShell(`
      <div class="state-card">
        <h2>Connect the Google Sheet</h2>
        <p>This page is ready to go live once it's pointed at your Sheet — nobody but you will see this message.</p>
        <ol>
          <li>In the Sheet: <b>Share</b> → General access → <b>Anyone with the link</b> → Viewer.</li>
          <li>Copy the Sheet ID from its URL — the long string between <code>/d/</code> and <code>/edit</code>.</li>
          <li>Open this file, find <code>const CONFIG</code> near the top, and paste it into <code>sheetId: ""</code>.</li>
          <li>Save the file and reopen it in your browser.</li>
        </ol>
        <hr class="divider">
        <p>Tab name being requested: <code>${CONFIG.leaderboardTab}</code> — matches the Leaderboard tab in the Golf Trip Score Tracker workbook by default. Change <code>leaderboardTab</code> in CONFIG if you renamed it.</p>
      </div>
    `);
  }

  /* ---------------- Error state ---------------- */
  function renderError(message){
    liveMode = false;
    renderShell(`
      <div class="state-card">
        <h2>Couldn't load scores</h2>
        <p>${message}</p>
        <ol>
          <li>Confirm the Sheet is shared as <b>Anyone with the link → Viewer</b>.</li>
          <li>Double-check the Sheet ID in <code>CONFIG.sheetId</code> — it's the string between <code>/d/</code> and <code>/edit</code> in the Sheet's URL, nothing else.</li>
          <li>Confirm the tab is named exactly <code>${CONFIG.leaderboardTab}</code>.</li>
        </ol>
        <hr class="divider">
        <p>It'll keep retrying every ${CONFIG.refreshSeconds}s, or hit "Refresh now" above once it's fixed.</p>
      </div>
    `);
  }

  /* ---------------- Board state ---------------- */
  function num(v){
    if(v===undefined||v===null) return null;
    const t = String(v).trim();
    if(t==='') return null;
    const n = Number(t);
    return isNaN(n) ? null : n;
  }

  function computeRanked(list, key){
    const withVal = list.filter(r=>r[key]!==null);
    const withoutVal = list.filter(r=>r[key]===null);
    withVal.sort((a,b)=>a[key]-b[key] || a.player.localeCompare(b.player));
    withoutVal.sort((a,b)=>a.player.localeCompare(b.player));

    let out = [];
    let prevVal = null, prevRank = 0, count = 0;
    withVal.forEach(r=>{
      count++;
      let rank;
      if(r[key]===prevVal){ rank = prevRank; }
      else { rank = count; prevRank = rank; prevVal = r[key]; }
      out.push({...r, _rank: rank, _tied: false});
    });
    // mark ties
    const rankCounts = {};
    out.forEach(r=>{ rankCounts[r._rank] = (rankCounts[r._rank]||0)+1; });
    out = out.map(r=>({...r, _tied: rankCounts[r._rank] > 1}));
    withoutVal.forEach(r=> out.push({...r, _rank:null, _tied:false}));
    return out;
  }

  function renderBoard(){
    const totalKey = mode==='net' ? 'totalNet' : 'totalGross';
    const roundKeys = mode==='net' ? ['r1n','r2n','r3n','r4n'] : ['r1g','r2g','r3g','r4g'];
    const ranked = computeRanked(rows, totalKey);

    const rowsHtml = ranked.map(r=>{
      const rc = r._rank===1?'rank-1':r._rank===2?'rank-2':r._rank===3?'rank-3':'';
      const rankLabel = r._rank===null ? '–' : (r._tied?'T-':'')+r._rank;
      const holes = roundKeys.map(k=>{
        const v = r[k];
        return v===null
          ? `<div class="hole-tile dash">–</div>`
          : `<div class="hole-tile">${v}</div>`;
      }).join('');
      const totalVal = r[totalKey];
      const totalHtml = totalVal===null
        ? `<span class="empty">–</span>`
        : `${totalVal}`;
      return `
        <div class="row ${rc}">
          <div class="rank">${rankLabel}</div>
          <div class="player-cell">
            <div class="player-name">${escapeHtml(r.player)}</div>
            <div class="thru">${r.roundsPlayed}/4 rounds</div>
          </div>
          ${holes}
          <div class="total-cell">${totalHtml}</div>
        </div>`;
    }).join('');

    renderShell(`
      <div class="board">
        <div class="board-head">
          <span>Rk</span><span>Player</span>
          <span>R1</span><span>R2</span><span>R3</span><span>R4</span>
          <span>Total</span>
        </div>
        ${rowsHtml || '<div class="state-card"><h2>No scores yet</h2><p>Once gross scores are entered in the Sheet, players will appear here.</p></div>'}
      </div>
    `);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ---------------- History view ---------------- */
  function parseHistoryRows(csvText){
    const parsed = Papa.parse(csvText.trim(), {header:true, skipEmptyLines:true});
    return parsed.data.map(row => ({
      year: (row['Year']||'').toString().trim(),
      location: (row['Trip Location']||'').trim(),
      player: (row['Player']||'').trim(),
      r1n:num(row['R1 Net']), r2n:num(row['R2 Net']), r3n:num(row['R3 Net']), r4n:num(row['R4 Net']),
      roundsPlayed: num(row['Rounds Played']),
      totalNet: num(row['Total Net']),
      netRank: num(row['Net Rank']),
      r1g:num(row['R1 Gross']), r2g:num(row['R2 Gross']), r3g:num(row['R3 Gross']), r4g:num(row['R4 Gross']),
      totalGross: num(row['Total Gross']),
      grossRank: num(row['Gross Rank']),
    })).filter(r => r.player!=='' && !r.player.toLowerCase().startsWith('e.g.'));
  }

  function parseTrophyRows(csvText){
    const parsed = Papa.parse(csvText.trim(), {header:true, skipEmptyLines:true});
    return parsed.data.map(row => ({
      year: (row['Year']||'').toString().trim(),
      location: (row['Trip Location']||'').trim(),
      format: (row['Format']||'').trim(),
      champion: (row['Champion']||'').trim(),
      result: (row['Result']||'').trim(),
    })).filter(r => r.year!=='' && !r.champion.toLowerCase().startsWith('e.g.'));
  }

  function parseHighlightRows(csvText){
    const parsed = Papa.parse(csvText.trim(), {header:true, skipEmptyLines:true});
    return parsed.data.map(row => ({
      year: (row['Year']||'').toString().trim(),
      location: (row['Trip Location']||'').trim(),
      player: (row['Player']||'').trim(),
      hole: (row['Hole']||'').toString().trim(),
      par: (row['Par']||'').toString().trim(),
      achievement: (row['Achievement']||'').trim(),
      notes: (row['Notes']||'').trim(),
    })).filter(r => r.year!=='' && r.player!=='' && !r.player.toLowerCase().startsWith('e.g.'));
  }

  function fetchTab(tab){
    return fetch(csvUrl(tab)).then(res=>{
      if(!res.ok) throw new Error("HTTP "+res.status);
      return res.text();
    }).then(text=>{
      if(text.trim().startsWith('<')) throw new Error("Got a webpage instead of data.");
      return text;
    });
  }

  function goHistory(){
    if(historyLoaded){ renderHistory(); return; }
    renderShell(`<div class="state-card"><h2>Loading history…</h2><p>Pulling past trips from the Sheet.</p></div>`);

    Promise.allSettled([fetchTab(CONFIG.trophiesTab), fetchTab(CONFIG.historyTab), fetchTab(CONFIG.highlightsTab)])
      .then(([troph, hist, hl])=>{
        if(troph.status==='fulfilled'){ trophyRows = parseTrophyRows(troph.value); trophyError = null; }
        else { trophyRows = []; trophyError = troph.reason.message || "Couldn't load Trophies."; }

        if(hist.status==='fulfilled'){ historyRows = parseHistoryRows(hist.value); historyError = null; }
        else { historyRows = []; historyError = hist.reason.message || "Couldn't load History."; }

        if(hl.status==='fulfilled'){ highlightRows = parseHighlightRows(hl.value); highlightError = null; }
        else { highlightRows = []; highlightError = hl.reason.message || "Couldn't load Highlights."; }

        historyLoaded = true;
        renderHistory();
      });
  }

  function renderHistory(){
    if(trophyError && historyError){
      renderShell(`
        <div class="state-card">
          <h2>Couldn't load history</h2>
          <p>${trophyError}</p>
          <ol>
            <li>Confirm tabs named exactly <code>${CONFIG.trophiesTab}</code> and <code>${CONFIG.historyTab}</code> exist in the Sheet.</li>
            <li>Confirm the Sheet is still shared as <b>Anyone with the link → Viewer</b>.</li>
          </ol>
        </div>
      `);
      return;
    }
    if(trophyRows.length === 0 && historyRows.length === 0 && highlightRows.length === 0){
      renderShell(`
        <div class="state-card">
          <h2>No trips logged yet</h2>
          <p>This year's the first one on record. Once this trip wraps, add a row to Trophies (who won) and to History (each player's totals) — see the Read Me tab — and it'll show up here for good.</p>
        </div>
      `);
      return;
    }

    const years = [...new Set([...trophyRows.map(r=>r.year), ...historyRows.map(r=>r.year)])]
      .sort((a,b)=>b.localeCompare(a,undefined,{numeric:true}));

    if(selectedHistoryYear === null){
      selectedHistoryYear = years[0] || 'all'; // default to most recent year
    }
    const activeYears = years; // Hall of Fame always shows every year

    const yearOptions = [
      `<option value="all"${selectedHistoryYear==='all'?' selected':''}>All Years</option>`,
      ...years.map(y=>`<option value="${escapeHtml(y)}"${selectedHistoryYear===y?' selected':''}>${escapeHtml(y)}</option>`)
    ].join('');
    const yearFilterHtml = `
      <select class="year-filter" id="year-filter" aria-label="Filter by year">
        ${yearOptions}
      </select>`;

    const hofCards = activeYears.map(y=>{
      const troph = trophyRows.find(r=>r.year===y);
      const yearHistRows = historyRows.filter(r=>r.year===y);
      const loc = troph?.location || yearHistRows.find(r=>r.location)?.location || '';
      const netChamps = yearHistRows.filter(r=>r.netRank===1);
      const grossChamps = yearHistRows.filter(r=>r.grossRank===1);

      const statChip = (label, champs, key) => champs.length ? `
        <div class="hof-champ">
          <div class="hof-champ-label">Low ${label}</div>
          <div class="hof-champ-name">${champs.map(c=>escapeHtml(c.player)).join(' &amp; ')}</div>
          <div class="hof-champ-score">${champs[0][key]}</div>
        </div>` : '';

      return `
        <div class="hof-card">
          <div class="hof-year">${escapeHtml(y)}</div>
          <div class="hof-loc">${escapeHtml(loc)}</div>
          ${troph?.format ? `<div class="hof-format">${escapeHtml(troph.format)}</div>` : ''}
          <div class="hof-trophy-label">Champion</div>
          <div class="hof-trophy-name">${troph?.champion ? escapeHtml(troph.champion) : '<span style="color:var(--ink-dimmer);font-weight:500;">Not recorded</span>'}</div>
          ${troph?.result ? `<div class="hof-result">${escapeHtml(troph.result)}</div>` : ''}
          ${(netChamps.length || grossChamps.length) ? `
          <div class="hof-stats">
            ${statChip('Net', netChamps, 'totalNet')}
            ${statChip('Gross', grossChamps, 'totalGross')}
          </div>` : ''}
        </div>`;
    }).join('');

    const playerStats = {};
    historyRows.forEach(r=>{
      if(!playerStats[r.player]) playerStats[r.player] = {player:r.player, years:new Set(), netTitles:0, grossTitles:0};
      playerStats[r.player].years.add(r.year);
      if(r.netRank===1) playerStats[r.player].netTitles++;
      if(r.grossRank===1) playerStats[r.player].grossTitles++;
    });
    const wins = Object.values(playerStats)
      .map(p=>({player:p.player, trips:p.years.size, netTitles:p.netTitles, grossTitles:p.grossTitles}))
      .sort((a,b)=> b.netTitles-a.netTitles || b.grossTitles-a.grossTitles || b.trips-a.trips || a.player.localeCompare(b.player));

    const winsRows = wins.map(p=>`
      <tr>
        <td>${escapeHtml(p.player)}</td>
        <td>${p.trips}</td>
        <td>${p.netTitles ? `<span class="medal">${p.netTitles}</span>` : '0'}</td>
        <td>${p.grossTitles ? `<span class="medal">${p.grossTitles}</span>` : '0'}</td>
      </tr>`).join('');

    // All-time best single-trip Net and Gross totals, across every year on record
    let bestNet = null, bestGross = null;
    historyRows.forEach(r=>{
      if(r.totalNet !== null){
        if(bestNet===null || r.totalNet < bestNet.value) bestNet = {value:r.totalNet, entries:[r]};
        else if(r.totalNet === bestNet.value) bestNet.entries.push(r);
      }
      if(r.totalGross !== null){
        if(bestGross===null || r.totalGross < bestGross.value) bestGross = {value:r.totalGross, entries:[r]};
        else if(r.totalGross === bestGross.value) bestGross.entries.push(r);
      }
    });
    const recordBox = (label, rec) => {
      if(!rec) return `
        <div class="record-box">
          <div class="record-label">${label}</div>
          <div class="record-value" style="color:var(--ink-dimmer);font-size:16px;">Not enough data yet</div>
        </div>`;
      const names = rec.entries.map(e=>escapeHtml(e.player)).join(' &amp; ');
      const years = [...new Set(rec.entries.map(e=>e.year))].sort((a,b)=>b.localeCompare(a,undefined,{numeric:true})).join(', ');
      return `
        <div class="record-box">
          <div class="record-label">${label}</div>
          <div class="record-value">${rec.value}</div>
          <div class="record-who">${names} · ${escapeHtml(years)}</div>
        </div>`;
    };
    const recordsHtml = (bestNet || bestGross) ? `
      <div class="records-grid">
        ${recordBox('Best Net, All-Time', bestNet)}
        ${recordBox('Best Gross, All-Time', bestGross)}
      </div>` : '';

    const sortedHistory = historyRows
      .filter(r => selectedHistoryYear === 'all' || r.year === selectedHistoryYear)
      .sort((a,b)=>{
        if(a.year!==b.year) return b.year.localeCompare(a.year,undefined,{numeric:true});
        const ar = a.netRank===null ? 999 : a.netRank, br = b.netRank===null ? 999 : b.netRank;
        return ar-br;
      });

    const roundCell = v => v===null||v===undefined ? '–' : v;

    const histRows = sortedHistory.map(r => {
      if(selectedHistoryYear === 'all') return `
      <tr>
        <td>${escapeHtml(r.year)}</td>
        <td class="cell-text">${escapeHtml(r.location)}</td>
        <td class="cell-text">${escapeHtml(r.player)}</td>
        <td>${r.totalNet ?? '–'}</td>
        <td>${r.netRank ?? '–'}</td>
        <td>${r.totalGross ?? '–'}</td>
        <td>${r.grossRank ?? '–'}</td>
      </tr>`;
      const rounds = mode==='net' ? [r.r1n,r.r2n,r.r3n,r.r4n] : [r.r1g,r.r2g,r.r3g,r.r4g];
      const total = mode==='net' ? r.totalNet : r.totalGross;
      const rank = mode==='net' ? r.netRank : r.grossRank;
      return `
      <tr>
        <td class="cell-text">${escapeHtml(r.player)}</td>
        <td>${rank ?? '–'}</td>
        ${rounds.map(v=>`<td>${roundCell(v)}</td>`).join('')}
        <td>${total ?? '–'}</td>
      </tr>`;
    }).join('');

    const histTableHead = selectedHistoryYear === 'all'
      ? `<tr><th>Year</th><th class="cell-text">Location</th><th class="cell-text">Player</th><th>Net</th><th>Net Rk</th><th>Gross</th><th>Gross Rk</th></tr>`
      : `<tr><th class="cell-text">Player</th><th>Rk</th><th>R1</th><th>R2</th><th>R3</th><th>R4</th><th>${mode==='net'?'Net':'Gross'}</th></tr>`;
    const histColspan = 7;
    const histColgroup = selectedHistoryYear === 'all'
      ? `<colgroup><col style="width:9%"><col style="width:27%"><col style="width:22%"><col style="width:11%"><col style="width:9%"><col style="width:12%"><col style="width:10%"></colgroup>`
      : `<colgroup><col style="width:34%"><col style="width:11%"><col style="width:11%"><col style="width:11%"><col style="width:11%"><col style="width:11%"><col style="width:11%"></colgroup>`;

    const fullHistLabel = selectedHistoryYear === 'all' ? 'Full History' : `Full History — ${escapeHtml(selectedHistoryYear)}`;
    const showHistToggle = selectedHistoryYear !== 'all';

    const sortedHighlights = [...highlightRows].sort((a,b)=>b.year.localeCompare(a.year,undefined,{numeric:true}));
    const highlightItems = sortedHighlights.map(h=>{
      const badgeClass = h.achievement.toLowerCase().includes('hole-in-one') || h.achievement.toLowerCase().includes('ace') ? 'ace' : 'albatross';
      return `
      <div class="highlight-item">
        <span class="highlight-badge ${badgeClass}">${escapeHtml(h.achievement || '—')}</span>
        <div class="highlight-body">
          <div class="highlight-main"><strong>${escapeHtml(h.player)}</strong> — Hole ${escapeHtml(h.hole)}${h.par ? ` (Par ${escapeHtml(h.par)})` : ''} · ${escapeHtml(h.year)}${h.location ? `, ${escapeHtml(h.location)}` : ''}</div>
          ${h.notes ? `<div class="highlight-notes">${escapeHtml(h.notes)}</div>` : ''}
        </div>
      </div>`;
    }).join('');

    renderShell(`
      <div class="sub-nav">
        <button id="sub-achievements" class="${historySubView==='achievements'?'active':''}">Achievements</button>
        <button id="sub-scores" class="${historySubView==='scores'?'active':''}">Scores</button>
      </div>

      ${historySubView === 'achievements' ? `
      <div class="section-label">Hall of Fame</div>
      ${trophyError ? `<p class="helper-text" style="margin:0 2px 12px;">Trophies tab didn't load — showing individual stats only. ${trophyError}</p>` : ''}
      <div class="hof-scroll">${hofCards}</div>

      ${highlightItems ? `
      <div class="section-label">Top Shots</div>
      <div class="table-card highlights-card">${highlightItems}</div>` : highlightError ? `<p class="helper-text" style="margin:-6px 2px 0;">Highlights tab didn't load. ${highlightError}</p>` : ''}

      ${recordsHtml ? `
      <div class="section-label">Best of the Trip</div>
      ${recordsHtml}` : ''}

      ${historyRows.length ? `
      <div class="section-label">All-Time Wins</div>
      <p class="helper-text" style="margin:-6px 2px 12px;">Best individual stroke totals by year — not necessarily who took home the trophy in match-play years.</p>
      <div class="table-card">
        <table class="wins-table">
          <thead><tr><th>Player</th><th>Trips</th><th>Low Net</th><th>Low Gross</th></tr></thead>
          <tbody>${winsRows}</tbody>
        </table>
      </div>` : historyError ? `<p class="helper-text" style="margin-top:24px;">History tab didn't load. ${historyError}</p>` : ''}
      ` : `
      <div class="scores-header">
        <div class="section-label" style="margin:0;">${fullHistLabel}</div>
        <div class="scores-controls">
          ${showHistToggle ? `
          <div class="toggle">
            <button id="hist-btn-net" class="${mode==='net'?'active':''}">Net</button>
            <button id="hist-btn-gross" class="${mode==='gross'?'active':''}">Gross</button>
          </div>` : ''}
          ${yearFilterHtml}
        </div>
      </div>
      <div class="table-card table-scroll">
        <table class="hist-table">
          ${histColgroup}
          <thead>${histTableHead}</thead>
          <tbody>${histRows || `<tr><td colspan="${histColspan}" style="text-align:center;color:var(--ink-dimmer);padding:16px;">No rounds on record for this year.</td></tr>`}</tbody>
        </table>
      </div>
      ${historyError ? `<p class="helper-text" style="margin-top:16px;">History tab didn't load. ${historyError}</p>` : ''}
      `}
    `);

    document.getElementById('sub-achievements').onclick = () => { historySubView='achievements'; renderHistory(); };
    document.getElementById('sub-scores').onclick = () => { historySubView='scores'; renderHistory(); };

    const yearFilterEl = document.getElementById('year-filter');
    if(yearFilterEl){
      yearFilterEl.onchange = (e) => {
        selectedHistoryYear = e.target.value;
        renderHistory();
      };
    }
    const histNetBtn = document.getElementById('hist-btn-net');
    const histGrossBtn = document.getElementById('hist-btn-gross');
    if(histNetBtn){ histNetBtn.onclick = () => { mode='net'; renderHistory(); }; }
    if(histGrossBtn){ histGrossBtn.onclick = () => { mode='gross'; renderHistory(); }; }
  }

  /* ---------------- Data loading ---------------- */
  function parseRows(csvText){
    const parsed = Papa.parse(csvText.trim(), {header:true, skipEmptyLines:true});
    return parsed.data.map(row => ({
      player: (row['Player']||'').trim(),
      roundsPlayed: num(row['Rounds Played']) ?? 0,
      r1n:num(row['R1 Net']), r2n:num(row['R2 Net']), r3n:num(row['R3 Net']), r4n:num(row['R4 Net']),
      totalNet: num(row['Total Net']),
      r1g:num(row['R1 Gross']), r2g:num(row['R2 Gross']), r3g:num(row['R3 Gross']), r4g:num(row['R4 Gross']),
      totalGross: num(row['Total Gross']),
    })).filter(r=>r.player!=='');
  }

  function load(manual){
    if(!CONFIG.sheetId || CONFIG.sheetId.trim()===''){
      renderSetup();
      return;
    }
    fetch(csvUrl(CONFIG.leaderboardTab))
      .then(res=>{
        if(!res.ok) throw new Error("HTTP "+res.status);
        return res.text();
      })
      .then(text=>{
        if(text.trim().startsWith('<')){
          throw new Error("Got a webpage instead of data — the Sheet is probably still private.");
        }
        rows = parseRows(text);
        liveMode = true;
        lastSync = new Date();
        if(view==='history') renderHistory(); else renderBoard();
      })
      .catch(err=>{
        renderError(err.message || "Something went wrong fetching the Sheet.");
      });
  }

  load(false);
  setInterval(load, CONFIG.refreshSeconds*1000);

})();
</script>
</body>
</html>
